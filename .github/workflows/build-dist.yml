name: Build PayPal installable archive

on:
  push:
    branches:
      - stabilize-paypal-1.7.0
      - paypal-1.7
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paypal-dist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build installable ZIP
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Geeklog installable archive
        shell: bash
        run: |
          set -euo pipefail

          VERSION="1.7.0"
          MIN_GL="2.1.1"
          ARCHIVE="paypal_${VERSION}_${MIN_GL}.zip"

          rm -rf build
          mkdir -p build/paypal dist

          rsync -a ./ build/paypal/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.gitignore' \
            --exclude 'build/' \
            --exclude 'dist/'

          # Geeklog expects the plugin package to contain one top-level
          # directory named "paypal".
          test -f build/paypal/autoinstall.php
          test -f build/paypal/functions.inc
          test -d build/paypal/admin
          test -d build/paypal/public_html
          test -d build/paypal/templates
          test -d build/paypal/sql

          rm -f "dist/${ARCHIVE}"
          (
            cd build
            zip -qr "../dist/${ARCHIVE}" paypal
          )

          unzip -t "dist/${ARCHIVE}" >/dev/null

          FIRST_ENTRY="$(unzip -Z1 "dist/${ARCHIVE}" | head -n 1)"
          case "${FIRST_ENTRY}" in
            paypal/*|paypal/) ;;
            *)
              echo "Error: archive must have paypal/ as its top-level directory." >&2
              exit 1
              ;;
          esac

          echo "Created dist/${ARCHIVE}"
          ls -lh "dist/${ARCHIVE}"

      - name: Publish workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: paypal-1.7.0-installable
          path: dist/paypal_1.7.0_2.1.1.zip
          if-no-files-found: error
          retention-days: 30

      - name: Update dist archive
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -f dist/paypal_1.7.0_2.1.1.zip

          if git diff --cached --quiet; then
            echo 'Archive is already up to date.'
            exit 0
          fi

          git commit -m 'Build PayPal 1.7.0 archive [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
